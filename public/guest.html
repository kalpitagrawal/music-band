<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MusicBand — Joining Session...</title>
    <meta name="description" content="Join a MusicBand listening session — listen to music in perfect sync with friends." />
    <script>
      // Redirect to main app with room parameter preserved
      const params = new URLSearchParams(window.location.search);
      const room = params.get('room');
      if (room) {
        window.location.replace('/?room=' + encodeURIComponent(room));
      } else {
        window.location.replace('/');
      }
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
